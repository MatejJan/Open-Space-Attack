<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="data:,">
  <title>Open Space Attack</title>
  <style>
    :root {
      color-scheme: dark;
      background: #000;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    body {
      display: grid;
      place-items: center;
    }

    #game-shell {
      display: flex;
      width: 100%;
      height: 100%;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #game-stage {
      display: grid;
      min-height: 0;
      flex: 1 1 auto;
      width: 100%;
      place-items: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      flex: none;
      background: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      outline: none;
      touch-action: none;
    }

    #instructions {
      display: flex;
      min-height: 34px;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      width: 100%;
      padding: 8px 12px max(8px, env(safe-area-inset-bottom));
      border-top: 1px solid #00ff00;
      color: #00ff00;
      background: #000;
      font-size: 11px;
      letter-spacing: .08em;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      white-space: nowrap;
    }

    #instructions kbd {
      color: #ffff00;
      font: inherit;
    }

    #error {
      display: none;
      max-width: 34rem;
      padding: 1.5rem;
      color: #ff0000;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 620px) {
      #instructions {
        flex-wrap: wrap;
        gap: .35rem .65rem;
        font-size: 9px;
        letter-spacing: .03em;
        line-height: 1.2;
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main id="game-shell">
    <div id="game-stage" aria-label="Open Space Attack game canvas"></div>
    <div id="instructions" aria-label="Game controls">
      <span>Move <kbd>← →</kbd> / <kbd>A D</kbd></span>
      <span>Fire <kbd>Space</kbd></span>
      <span>Start <kbd>Enter</kbd></span>
      <span>Pause <kbd>P</kbd></span>
      <span id="crt-control" aria-label="CRT filter on. Press C to toggle.">CRT <kbd>C</kbd>: <span id="crt-status">On</span></span>
    </div>
    <p id="error" role="alert"></p>
  </main>

  <script src="libraries/three.min.js"></script>
  <script src="classes/GameConfig.js"></script>
  <script src="classes/CrtFilter.js"></script>
  <script src="classes/PixelSprite.js"></script>
  <script src="classes/AtlasSprite.js"></script>
  <script src="classes/PixelText.js"></script>
  <script src="classes/InputManager.js"></script>
  <script src="classes/AudioManager.js"></script>
  <script src="classes/Starfield.js"></script>
  <script src="classes/Projectile.js"></script>
  <script src="classes/Explosion.js"></script>
  <script src="classes/Enemy.js"></script>
  <script src="classes/EnemyFormation.js"></script>
  <script src="classes/Player.js"></script>
  <script src="classes/GameHud.js"></script>
  <script src="classes/Game.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', function () {
      var stage = document.getElementById('game-stage');
      var error = document.getElementById('error');

      try {
        window.openSpaceAttack = new Game(stage, document.getElementById('instructions'));
      } catch (reason) {
        stage.style.display = 'none';
        error.style.display = 'block';
        error.textContent = 'Open Space Attack could not start. This browser may not support WebGL. ' + reason.message;
        console.error(reason);
      }
    });
  </script>
</body>
</html>
